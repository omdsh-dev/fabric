name: release

# Every push to main builds the trio and launcher with the direct build script,
# then publishes the packed bundle tarball to a GitHub Release tagged v<version>
# (the version from package.json). The release carries the compiled lib/ output
# ready-made. Bump the version to cut a new release; re-pushing the same version
# refreshes that release's artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - name: Pack the bundle and the trio
        run: |
          pnpm pack --pack-destination dist
          mv dist/*.tgz dist/pkg.tgz
          pnpm -C packages/cordis-fabric pack --pack-destination "$PWD/dist"
          pnpm -C packages/cordis-fabric-api pack --pack-destination "$PWD/dist"
          pnpm -C packages/cordis-fabric-dsh pack --pack-destination "$PWD/dist"
          mv dist/cordis-fabric-[0-9]*.tgz dist/cordis-fabric.tgz
          mv dist/cordis-fabric-api-*.tgz dist/cordis-fabric-api.tgz
          mv dist/cordis-fabric-dsh-*.tgz dist/cordis-fabric-dsh.tgz
      - name: Publish to the version release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tgz --clobber
          else
            gh release create "$tag" dist/*.tgz --title "$tag" --generate-notes
          fi
