packages:
  - packages/*

autoInstallPeers: false

# Consumers resolve the trio from the GitHub repository via the git
# subdirectory specs in the root manifest; inside this workspace, installs
# resolve them to the local packages instead of re-cloning the repository.
overrides:
  cordis-fabric: workspace:*
  cordis-fabric-api: workspace:*
  cordis-fabric-dsh: workspace:*

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis-plugin-hmr@1.0.16'
  - '@deepseek-ai/cordis-plugin-include@1.0.6'
  - '@deepseek-ai/cordis-plugin-loader@1.0.2'
  - '@deepseek-ai/cordis-plugin-timer@1.1.3'
  - '@deepseek-ai/cosmokit@1.8.2'
  - '@deepseek-ai/schemastery@3.18.1'
