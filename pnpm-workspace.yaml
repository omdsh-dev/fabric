packages:
  - packages/*

autoInstallPeers: false
nodeLinker: hoisted

# Consumers resolve the root package's three npm semver dependencies. Inside
# this workspace, overrides resolve the trio to local packages instead of
# downloading or unpacking them.
overrides:
  '@oh-my-dsh/stent': workspace:*
  '@oh-my-dsh/stent-api': workspace:*
  '@oh-my-dsh/stent-dsh': workspace:*

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis-plugin-hmr@1.0.16'
  - '@deepseek-ai/cordis-plugin-include@1.0.6'
  - '@deepseek-ai/cordis-plugin-loader@1.0.2'
  - '@deepseek-ai/cordis-plugin-timer@1.1.3'
  - '@deepseek-ai/cosmokit@1.8.2'
  - '@deepseek-ai/schemastery@3.18.1'
  # The dsh-* host packages iterate fast (rc trains); the trio's peers and
  # devDeps track the upstream 0813 series, and the newest rc is routinely
  # published within the minimumReleaseAge window. Name-only entries exempt
  # every version of the matching packages.
  - '@deepseek-ai/dsh-*'
