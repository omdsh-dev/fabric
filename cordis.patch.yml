# Fabric is explicit opt-in. The bundle mounts the host transformation service
# and cooperative API; browser code is supplied by the package's dshClient face.
# The launcher/bootstrap and browser build seams must come from the DSH version
# selected by the profile.
- insert:
    - id: cordis-fabric
      name: '@deepseek-ai/dsh-cordis-fabric'
      disabled: true

    - id: cordis-fabric-api
      name: '@deepseek-ai/dsh-cordis-fabric/api'
      disabled: true
